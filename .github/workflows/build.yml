# .github/workflows/build.yml
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit SHA or ref to checkout"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # If a ref is provided (like from publish.yml), use it. Otherwise, use the default.
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Verify build outputs
        shell: bash
        run: |
          shopt -s nullglob
          dts_files=(dist/*.d.ts)
          global_js_files=(dist/*.global.js)
          js_files=(dist/*.js)

          failed=0
          if [ ${#dts_files[@]} -eq 0 ]; then
            echo "::error::Missing required declaration files (*.d.ts) in dist/"
            failed=1
          fi
          if [ ${#global_js_files[@]} -eq 0 ]; then
            echo "::error::Missing required global bundle files (*.global.js) in dist/"
            failed=1
          fi
          if [ ${#js_files[@]} -eq 0 ]; then
            echo "::error::Missing required JavaScript files (*.js) in dist/"
            failed=1
          fi

          if [ $failed -eq 1 ]; then
            exit 1
          fi
          echo "All required artifact patterns (*.d.ts, *.global.js, *.js) verified successfully."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/