# .github/workflows/publish.yml
name: Publish Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        run: node bump-patch.js

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          # [skip ci] prevents this automated commit from triggering another workflow run
          git commit -m "chore: bump version [skip ci]" || echo "No changes"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump-version
    uses: ./.github/workflows/build.yml
    with:
      # Pass the newly created commit SHA so the build uses the updated package.json
      ref: ${{ needs.bump-version.outputs.new_sha }}

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Verify output files
        run: |
          ls -lah dist/
          test -f dist/ossm-ble-web.d.ts
          test -f dist/ossm-ble-web.global.js
          test -f dist/ossm-ble-web.global.js.map
          test -f dist/ossm-ble-web.js
          test -f dist/ossm-ble-web.js.map